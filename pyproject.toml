[project]
name = "fairdatanow"
version = "0.2.18"
description = "Experimental Python package to support working with data from (y)our Nextcloud server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["nextcloud", "data"]
authors = [
    { name = "fligt", email = "frank.ligterink@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "datashader>=0.19.1",
    "holoviews>=1.23.2",
    "humanize>=4.16.0",
    "ipynb-path>=0.1.5",
    "ipython>=9.17.1",
    "keyring>=25.7.0",
    "keyrings-cryptfile>=1.3.9",
    "matplotlib>=3.11.2",
    "nc-py-api>=0.30.3",
    "pandas>=3.0.6",
    "panel>=1.9.4",
    "param>=2.4.2",
    "toml>=0.10.2",
]

[project.urls]
Homepage = "https://github.com/fligt/fairdatanow"
Documentation = "https://fligt.github.io/fairdatanow"
Repository = "https://github.com/fligt/fairdatanow"

[project.scripts]
fairdatanow = "fairdatanow:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "imageio>=2.38.1",
    "ipykernel>=7.4.0",
    "jupyter-bokeh>=4.1.0",
    "jupytext>=1.19.6",
    "nbclient>=0.11.0",
    "pip>=26.2.1",
]

[tool.jupytext]
formats = "ipynb,qmd"
